# Q-Learning Experiment Config — Version 1
# Run: python train.py --config configs/qlearning_v1.yaml

run_id: "qlearning_v1"
n_episodes: 1000
max_steps: 24

agent:
  alpha: 0.1
  gamma: 0.95
  epsilon: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995

sdg:
  - "SDG 7  - Affordable and Clean Energy"
  - "SDG 9  - Industry, Innovation and Infrastructure"
  - "SDG 13 - Climate Action"
