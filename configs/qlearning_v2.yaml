# Q-Learning Experiment Config — Version 2
# Run: python train.py --config configs/qlearning_v2.yaml

run_id: "qlearning_v2"
n_episodes: 1000
max_steps: 24

agent:
  alpha: 0.2
  gamma: 0.99
  epsilon: 1.0
  epsilon_min: 0.01
  epsilon_decay: 0.990

sdg:
  - "SDG 7  - Affordable and Clean Energy"
  - "SDG 9  - Industry, Innovation and Infrastructure"
  - "SDG 13 - Climate Action"
