name: Train Energy Grid RL Agent

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gymnasium numpy matplotlib pyyaml mlflow

    - name: Run training - Experiment 1
      run: |
        python train.py --config configs/qlearning_v1.yaml

    - name: Run visualizations - v1
      run: |
        python visualize.py --run qlearning_v1

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: training-results
        path: results/
