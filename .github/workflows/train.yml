name: Train Energy Grid RL Agent

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run training - Experiment 1
      run: |
        python train.py --config configs/qlearning_v1.yaml

    - name: Run training - Experiment 2
      run: |
        python train.py --config configs/qlearning_v2.yaml

    - name: Generate visualizations - v1
      run: |
        python visualize.py --run qlearning_v1

    - name: Generate visualizations - v2
      run: |
        python visualize.py --run qlearning_v2

    - name: Upload results as artifacts
      uses: actions/upload-artifact@v3
      with:
        name: training-results
        path: |
          results/
          experiments/